name: travel

services:
  backend:
    image: docker.io/library/python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app:ro
    env_file:
      - path: ./backend/.env
        format: raw
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    command:
      - sh
      - -c
      - pip install --no-cache-dir -r requirements.txt && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 60s
      retries: 12

  frontend:
    image: docker.io/library/node:24-alpine
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    volumes:
      - ./frontend:/app:ro
      - frontend_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - npm ci && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    ports:
      - "127.0.0.1:8080:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  frontend_node_modules:
